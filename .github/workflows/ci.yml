name: CI - Qualidade e testes
on:
  push:
    branches: ['main', 'fase/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run contract
      - name: Gate de regras e estados
        run: npm run flow:check
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: node-dist
          path: dist/
