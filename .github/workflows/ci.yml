name: CI - Qualidade e testes
on:
  push:
    branches: ['main', 'fase/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    name: Qualidade > Testes > Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar de forma reproduzível
        run: npm ci
      - name: Checar sintaxe
        run: npm run check
      - name: Testar comportamento
        run: npm test
      - name: Empacotar aplicação
        run: npm run build
      - name: Guardar artefato
        uses: actions/upload-artifact@v4
        with:
          name: node-dist
          path: dist/
